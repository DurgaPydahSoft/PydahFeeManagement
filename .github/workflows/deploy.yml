name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts
          echo "SSH configured for host: ${{ secrets.HOST }}"

      - name: Deploy to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${USERNAME}@${HOST}" << 'ENDSSH'
          set -e

          PROJECT_DIR="/home/ec2-user/PydahFeeManagement"
          FRONTEND_WEB_ROOT="/var/www/pydahfee"

          echo "=========================================="
          echo "  Starting deployment"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

          echo "==> Navigating to project directory..."
          cd "${PROJECT_DIR}"

          echo "==> Pulling latest code from main..."
          git fetch origin main
          git checkout main
          git pull origin main

          echo "==> Installing backend dependencies..."
          cd "${PROJECT_DIR}/backend"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

          echo "==> Installing frontend dependencies..."
          cd "${PROJECT_DIR}/frontend"
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "==> Building frontend..."
          npm run build

          if [ ! -d "${PROJECT_DIR}/frontend/dist" ]; then
            echo "ERROR: frontend build output not found at frontend/dist"
            exit 1
          fi

          echo "==> Deploying frontend to ${FRONTEND_WEB_ROOT}..."
          sudo mkdir -p "${FRONTEND_WEB_ROOT}"
          sudo rsync -av --delete "${PROJECT_DIR}/frontend/dist/" "${FRONTEND_WEB_ROOT}/"

          echo "==> Restarting PM2 process: backend..."
          pm2 restart backend

          echo "==> Saving PM2 process list..."
          pm2 save

          echo "=========================================="
          echo "  Deployment completed successfully"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
