name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    steps:
      #################################################
      # Checkout code
      #################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Setup Node.js for frontend build
      #################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #################################################
      # Build frontend on GitHub Actions
      #################################################
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_CRM_FRONTEND_URL: https://crm.pydah.edu.in
          VITE_CRM_BACKEND_URL: https://pydah-crm-backend.pydah.edu.in
        run: |
          npm run build

      #################################################
      # Configure SSH
      #################################################
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      #################################################
      # Upload frontend dist to server
      #################################################
      - name: Upload frontend build
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/tmp/frontend-dist/"

      #################################################
      # Deploy to server
      #################################################
      - name: Deploy to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${USERNAME}@${HOST}" << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ec2-user/PydahFeeManagement"
          FRONTEND_WEB_ROOT="/var/www/pydahfee"

          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="

          cd "${PROJECT_DIR}"

          echo "==> Pulling latest code..."
          git fetch origin main

          # Check if backend dependencies actually changed before pulling
          PACKAGE_CHANGED=$(git diff HEAD origin/main -- backend/package-lock.json backend/package.json)

          git checkout main
          git pull origin main

          #################################################
          # BACKEND DEPENDENCIES (OPTIMIZED)
          #################################################
          cd "${PROJECT_DIR}/backend"

          if [ -n "$PACKAGE_CHANGED" ]; then
            echo "==> package.json changed. Installing backend dependencies..."
            npm ci --omit=dev
          else
            echo "==> No package changes detected. Skipping npm install."
          fi

          #################################################
          # FRONTEND DEPLOYMENT
          #################################################
          echo "==> Deploying frontend..."
          sudo mkdir -p "${FRONTEND_WEB_ROOT}"

          sudo rsync -av --delete \
            /tmp/frontend-dist/ \
            "${FRONTEND_WEB_ROOT}/"

          #################################################
          # PM2 RELOAD (LOW CPU SPIKE)
          #################################################
          echo "==> Reloading PM2 backend smoothly..."
          pm2 reload backend --update-env || pm2 start backend

          #################################################
          # CLEANUP
          #################################################
          rm -rf /tmp/frontend-dist

          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="

          ENDSSH

      #################################################
      # Cleanup SSH key
      #################################################
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key